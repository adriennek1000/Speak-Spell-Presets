<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speak & Spell Presets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one handheld unit centred on the page. Dark ink screen on top, caption strip, controls, then a rounded A-Z keyboard. */
:root{
  --bg:#dfe4ee; --fg:#161a2b; --muted:#5b6379;
  --body:#f6f7fb; --body-edge:#c9d0e0; --key:#ffffff; --key-edge:#cdd3e2;
  --screen:#12152a; --screen-fg:#ffb62e; --screen-dim:#4a4a62;
  --accent:#3b4cca; --accent-fg:#ffffff; --good:#1f9d6b; --bad:#d6453d;
  --sans:"Bricolage Grotesque",system-ui,sans-serif; --mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0e1a; --fg:#eceffa; --muted:#98a0bb;
  --body:#1c2038; --body-edge:#2c3253; --key:#2a3050; --key-edge:#161a30;
  --screen:#07080f; --screen-fg:#ffb62e; --screen-dim:#3a3a52;
  --accent:#7d8cff; --accent-fg:#0c0e1a; --good:#46d19a; --bad:#ff7a70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0e1a; --fg:#eceffa; --muted:#98a0bb;
  --body:#1c2038; --body-edge:#2c3253; --key:#2a3050; --key-edge:#161a30;
  --screen:#07080f; --screen-fg:#ffb62e; --screen-dim:#3a3a52;
  --accent:#7d8cff; --accent-fg:#0c0e1a; --good:#46d19a; --bad:#ff7a70; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:15px}
.device{max-width:560px;margin:0 auto;background:var(--body);border-radius:34px;padding:20px;
  box-shadow:0 2px 0 var(--body-edge) inset,0 24px 50px -20px rgba(10,15,40,.45),0 0 0 1px var(--body-edge);display:grid;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 6px}
h1{font-size:1.35rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.score{font-family:var(--mono);font-size:.8rem;color:var(--muted);display:flex;gap:14px}
.screen{background:var(--screen);border-radius:20px;padding:18px 16px 14px;box-shadow:0 0 0 6px var(--body-edge),inset 0 0 40px rgba(0,0,0,.6);min-height:150px;display:grid;gap:12px;align-content:space-between}
.prompt{font-family:var(--mono);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--screen-dim);display:flex;justify-content:space-between;gap:8px}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px;align-items:flex-end}
.slot{font-family:var(--mono);font-weight:500;font-size:2.4rem;line-height:1;color:var(--screen-fg);min-width:1.1ch;width:34px;text-align:center;border-bottom:3px solid var(--screen-dim);padding-bottom:4px;text-shadow:0 0 14px rgba(255,182,46,.5);text-transform:uppercase}
.slot.on{border-color:var(--screen-fg)}
.slot.ok{color:var(--good);border-color:var(--good);text-shadow:none}
.slot.no{color:var(--bad);border-color:var(--bad);text-shadow:none}
.caption{font-family:var(--mono);font-size:.85rem;color:var(--screen-fg);min-height:2.6em;text-align:center;opacity:.9}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row>*{flex:1 1 auto}
button,select{font:inherit}
.btn{border:0;border-radius:16px;padding:12px 14px;font-weight:700;cursor:pointer;background:var(--key);color:var(--fg);box-shadow:0 3px 0 var(--key-edge),0 0 0 1px var(--key-edge);transition:transform .06s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--key-edge),0 0 0 1px var(--key-edge)}
.btn.main{background:var(--accent);color:var(--accent-fg);box-shadow:0 3px 0 rgba(0,0,0,.3)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.kb{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.key{aspect-ratio:1/1.05;border:0;border-radius:12px;background:var(--key);color:var(--fg);font-weight:700;font-size:1.15rem;text-transform:uppercase;cursor:pointer;box-shadow:0 3px 0 var(--key-edge),0 0 0 1px var(--key-edge)}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--key-edge)}
.key.wide{grid-column:span 2;aspect-ratio:auto;font-size:.85rem}
.levels{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:14px}
.levels button{flex:1;border:0;border-radius:10px;padding:8px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}
.levels button[aria-pressed="true"]{background:var(--key);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.2)}
details{background:var(--bg);border-radius:16px;padding:10px 14px}
summary{cursor:pointer;font-weight:700}
.set{display:grid;gap:10px;margin-top:12px}
.set label{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-family:var(--mono)}
.set select,.set input{width:100%;min-width:0}
select{background:var(--key);color:var(--fg);border:1px solid var(--key-edge);border-radius:10px;padding:8px}
.note{font-size:.8rem;color:var(--muted);margin:0;line-height:1.45}
audio{width:100%;height:36px}
.device[data-mode="say"] .gm,.device[data-mode="say"] .slots,.device[data-mode="say"] #attempt,.device[data-mode="spell"] .say{display:none!important}
.say{display:grid;gap:10px}
.presethead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.btn.small{padding:8px 12px;font-size:.85rem;flex:0 0 auto}
.btn.small[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.pre{min-height:60px;text-align:left;padding:10px 12px;font-weight:700;font-size:.9rem;line-height:1.25;display:flex;align-items:center;overflow-wrap:anywhere}
.pre span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pre.empty{background:transparent;box-shadow:none;border:2px dashed var(--key-edge);color:var(--muted);font-weight:500}
.pre.on{background:var(--accent);color:var(--accent-fg)}
.preedit{display:grid;gap:3px;font:500 .7rem var(--mono);color:var(--muted);min-width:0}
.preedit input{width:100%;min-width:0;font:500 .9rem var(--sans);padding:10px;border-radius:12px;border:2px solid var(--key-edge);background:var(--key);color:var(--fg)}
.voicebar{display:grid;gap:8px}
.voicebar label{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-family:var(--mono)}
.voicebar select{width:100%;min-width:0}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.voicebar input[type="range"]{width:100%;min-width:0}
#sayText{width:100%;min-width:0;font:500 1.2rem var(--mono);padding:14px;border-radius:16px;border:2px solid var(--key-edge);background:var(--key);color:var(--fg)}
@media(max-width:420px){.slot{font-size:1.9rem;width:26px}.device{padding:14px;border-radius:26px}}
@media(prefers-reduced-motion:reduce){.btn,.key{transition:none}}
body{margin:0}
</style>
</head>
<body>

<main class="device" id="device" data-mode="spell">
  <header>
    <h1>Speak &amp; Spell</h1>
    <div class="score" aria-live="polite"><span id="stars">★ 0</span><span id="streak">Streak 0</span></div>
  </header>

  <div class="levels" id="modes" role="group" aria-label="Mode">
    <button type="button" data-mode="spell" aria-pressed="true">Spell</button>
    <button type="button" data-mode="say" aria-pressed="false">Say it</button>
  </div>

  <div class="voicebar">
    <label for="lang">Language and accent
      <select id="lang"></select></label>
    <div class="levels" id="gender" role="group" aria-label="Voice">
      <button type="button" data-g="male" aria-pressed="true">Male voice</button>
      <button type="button" data-g="female" aria-pressed="false">Female voice</button>
    </div>
    <div class="sliders">
      <label for="rate">Speed <span id="rateV">0.85</span>
        <input id="rate" type="range" min="0.5" max="1.2" step="0.05" value="0.85"></label>
      <label for="pitch">Pitch <span id="pitchV">1.0</span>
        <input id="pitch" type="range" min="0.6" max="1.4" step="0.05" value="1"></label>
    </div>
    <p class="note" id="vnote"></p>
  </div>

  <div class="levels gm" id="levels" role="group" aria-label="Level">
    <button type="button" data-level="easy" aria-pressed="true">Easy</button>
    <button type="button" data-level="medium" aria-pressed="false">Medium</button>
    <button type="button" data-level="hard" aria-pressed="false">Hard</button>
  </div>

  <section class="screen" aria-label="Display">
    <div class="prompt"><span id="status">Ready</span><span id="attempt"></span></div>
    <div class="slots" id="slots" aria-live="polite"></div>
    <div class="caption" id="caption">Press Start and I will say a word. Spell it back.</div>
  </section>

  <div class="row gm">
    <button class="btn main" id="start" type="button">Start</button>
    <button class="btn" id="again" type="button">Say word</button>
    <button class="btn" id="sentence" type="button">In a sentence</button>
    <button class="btn" id="hint" type="button">Hint</button>
  </div>

  <div class="kb gm" id="kb" role="group" aria-label="Letters"></div>
  <div class="row gm">
    <button class="btn" id="del" type="button">⌫ Delete</button>
    <button class="btn main" id="go" type="button">Enter ↵</button>
    <button class="btn" id="skip" type="button">Skip</button>
  </div>

  <section class="say" aria-label="Say it">
    <label for="sayText" class="note">Type anything and press Say it, or tap a preset below.</label>
    <input id="sayText" type="text" maxlength="200" autocomplete="off" spellcheck="false">
    <div class="row">
      <button class="btn main" id="sayGo" type="button">Say it</button>
      <button class="btn" id="saySpell" type="button">Spell it out</button>
      <button class="btn" id="saveSlot" type="button">Save as preset</button>
      <button class="btn" id="sayClear" type="button">Clear</button>
    </div>
    <div class="presethead">
      <strong>Presets</strong>
      <button class="btn small" id="editToggle" type="button" aria-pressed="false">Edit presets</button>
    </div>
    <div class="presets" id="presets"></div>
    <p class="note" id="presetNote" aria-live="polite">Tap a preset to hear it. Presets are saved in this browser.</p>
  </section>

</main>

<script>
const EN={
 easy:[["king","The king wore a golden crown."],["apple","She ate a red apple for lunch."],["house","They live in a small house."],["green","The grass is green."],["table","Put the cup on the table."],["happy","The puppy looks happy."],["water","Please drink some water."],["river","The river runs to the sea."],["clock","The clock strikes twelve."],["horse","The horse jumped the fence."],["bread","We bought fresh bread."],["tiger","The tiger is very fast."],["lemon","A lemon tastes sour."],["queen","The queen waved to the crowd."]],
 medium:[["garden","The roses grew in the garden."],["castle","The knight guarded the castle."],["orange","He peeled an orange."],["planet","Mars is a red planet."],["bicycle","I ride my bicycle to school."],["monkey","The monkey climbed the tree."],["kitchen","Tea is made in the kitchen."],["whisper","Please whisper in the library."],["twelve","There are twelve apples in the basket."],["jacket","Take a jacket, it is cold."],["village","The village has a little church."],["thunder","We heard thunder last night."],["library","She borrowed a book from the library."],["balloon","The balloon floated away."]],
 hard:[["necessary","It is necessary to wear a coat."],["separate","Keep the cups separate."],["receive","I hope to receive a letter."],["beautiful","What a beautiful morning."],["February","February is the shortest month."],["library","The library closes at five."],["answer","Write your answer here."],["knowledge","Knowledge is power."],["ceremony","The ceremony begins at noon."],["adventure","They set off on an adventure."],["restaurant","We dined at a restaurant."],["pronounce","How do you pronounce that word?"],["rhythm","The drummer kept the rhythm."],["embarrass","Do not embarrass your sister."]]
};
const mk=a=>({easy:a.slice(0,4),medium:a.slice(4,8),hard:a.slice(8,12)});
const WORDS={en:EN,
 fr:mk([["chat","Le chat dort sur le canapé."],["pain","Je mange du pain."],["lune","La lune brille ce soir."],["fleur","Cette fleur sent bon."],["pomme","Elle mange une pomme."],["livre","Il lit un livre."],["soleil","Le soleil se lève."],["maison","Nous habitons une grande maison."],["jardin","Les enfants jouent dans le jardin."],["fromage","J'aime le fromage."],["bateau","Le bateau part du port."],["voiture","La voiture est rouge."]]),
 es:mk([["casa","La casa es grande."],["gato","El gato duerme."],["sol","Hoy hace sol."],["mesa","El libro está en la mesa."],["libro","Leo un libro."],["playa","Vamos a la playa."],["verde","La hierba es verde."],["perro","El perro corre."],["manzana","Como una manzana."],["ventana","Abre la ventana."],["cocina","Cocino en la cocina."],["amigo","Mi amigo es simpático."]]),
 de:mk([["haus","Das Haus ist groß."],["hund","Der Hund spielt im Garten."],["brot","Ich esse Brot."],["mond","Der Mond scheint hell."],["apfel","Sie isst einen Apfel."],["blume","Die Blume riecht gut."],["sonne","Die Sonne scheint."],["katze","Die Katze schläft."],["wasser","Ich trinke Wasser."],["garten","Wir sitzen im Garten."],["fenster","Mach das Fenster auf."],["kaffee","Er trinkt Kaffee."]]),
 it:mk([["casa","La casa è grande."],["pane","Mangio il pane."],["sole","Oggi c'è il sole."],["mela","Lei mangia una mela."],["libro","Leggo un libro."],["fiore","Il fiore è rosso."],["acqua","Bevo l'acqua."],["gatto","Il gatto dorme."],["giardino","Giochiamo in giardino."],["finestra","Apri la finestra."],["cucina","Cucino in cucina."],["amico","Il mio amico è simpatico."]])
};
// Letter names, so single letters are never misread as words.
const LNS={
 en:{a:"ay",b:"bee",c:"see",d:"dee",e:"ee",f:"eff",g:"gee",h:"aitch",i:"eye",j:"jay",k:"kay",l:"ell",m:"em",n:"en",o:"oh",p:"pee",q:"cue",r:"ar",s:"ess",t:"tee",u:"you",v:"vee",w:"double you",x:"ex",y:"why",z:"zed"},
 fr:{a:"a",b:"bé",c:"cé",d:"dé",e:"eu",f:"effe",g:"gé",h:"hache",i:"i",j:"ji",k:"ka",l:"elle",m:"emme",n:"enne",o:"o",p:"pé",q:"ku",r:"erre",s:"esse",t:"té",u:"u",v:"vé",w:"double vé",x:"ixe",y:"i grec",z:"zède"},
 es:{a:"a",b:"be",c:"ce",d:"de",e:"e",f:"efe",g:"ge",h:"hache",i:"i",j:"jota",k:"ka",l:"ele",m:"eme",n:"ene",o:"o",p:"pe",q:"cu",r:"erre",s:"ese",t:"te",u:"u",v:"uve",w:"uve doble",x:"equis",y:"ye",z:"zeta"},
 de:{a:"a",b:"be",c:"ze",d:"de",e:"e",f:"eff",g:"ge",h:"ha",i:"i",j:"jot",k:"ka",l:"ell",m:"emm",n:"enn",o:"o",p:"pe",q:"ku",r:"er",s:"ess",t:"te",u:"u",v:"fau",w:"we",x:"iks",y:"ypsilon",z:"zett"},
 it:{a:"a",b:"bi",c:"ci",d:"di",e:"e",f:"effe",g:"gi",h:"acca",i:"i",j:"i lunga",k:"kappa",l:"elle",m:"emme",n:"enne",o:"o",p:"pi",q:"cu",r:"erre",s:"esse",t:"ti",u:"u",v:"vu",w:"doppia vu",x:"ics",y:"ipsilon",z:"zeta"}
};
// Spoken prompts per language.
const TX={
 en:{please:"Please spell",correct:"Correct!",praise:["Well done.","Splendid.","Jolly good.","Spot on.","Quite right."],notQuite:"Not quite. Have another go.",notQuiteCap:"Not quite. Try again.",keep:n=>"Keep going. The word has "+n+" letters.",giveUp:w=>"Not to worry. The word is "+w+". It is spelled",reveal:w=>"The word is "+w+". It is spelled",starts:"It starts with",has:n=>"and it has "+n+" letters.",test:"Good afternoon. Please spell the word: apples."},
 fr:{please:"Épelez",correct:"Correct !",praise:["Bravo.","Très bien.","Parfait.","Excellent.","Bien joué."],notQuite:"Pas tout à fait. Essayez encore.",notQuiteCap:"Pas tout à fait. Réessayez.",keep:n=>"Continuez. Le mot a "+n+" lettres.",giveUp:w=>"Ce n'est pas grave. Le mot est "+w+". Il s'écrit",reveal:w=>"Le mot est "+w+". Il s'écrit",starts:"Il commence par",has:n=>"et il a "+n+" lettres.",test:"Bonjour. Épelez le mot : pomme."},
 es:{please:"Deletrea",correct:"¡Correcto!",praise:["Muy bien.","Perfecto.","Excelente.","Bien hecho.","Genial."],notQuite:"Casi. Inténtalo otra vez.",notQuiteCap:"Casi. Inténtalo otra vez.",keep:n=>"Sigue. La palabra tiene "+n+" letras.",giveUp:w=>"No pasa nada. La palabra es "+w+". Se escribe",reveal:w=>"La palabra es "+w+". Se escribe",starts:"Empieza con",has:n=>"y tiene "+n+" letras.",test:"Buenas tardes. Deletrea la palabra: manzana."},
 de:{please:"Buchstabiere",correct:"Richtig!",praise:["Sehr gut.","Prima.","Ausgezeichnet.","Gut gemacht.","Wunderbar."],notQuite:"Nicht ganz. Versuch es noch einmal.",notQuiteCap:"Nicht ganz. Noch einmal.",keep:n=>"Weiter. Das Wort hat "+n+" Buchstaben.",giveUp:w=>"Kein Problem. Das Wort ist "+w+". Es wird so geschrieben",reveal:w=>"Das Wort ist "+w+". Es wird so geschrieben",starts:"Es beginnt mit",has:n=>"und es hat "+n+" Buchstaben.",test:"Guten Tag. Buchstabiere das Wort: Apfel."},
 it:{please:"Compita la parola",correct:"Giusto!",praise:["Bravo.","Molto bene.","Perfetto.","Ottimo.","Benissimo."],notQuite:"Quasi. Riprova.",notQuiteCap:"Quasi. Riprova.",keep:n=>"Continua. La parola ha "+n+" lettere.",giveUp:w=>"Non importa. La parola è "+w+". Si scrive",reveal:w=>"La parola è "+w+". Si scrive",starts:"Inizia con",has:n=>"e ha "+n+" lettere.",test:"Buongiorno. Compita la parola: mela."},
 hi:{test:"नमस्ते। यह हिन्दी आवाज़ है।"}
};
const LANGS=[
 {id:"en-GB",label:"English · British",base:"en",match:"en-gb"},
 {id:"en-AU",label:"English · Australian",base:"en",match:"en-au"},
 {id:"en-US",label:"English · American",base:"en",match:"en-us"},
 {id:"en-IE",label:"English · Irish",base:"en",match:"en-ie"},
 {id:"en-NZ",label:"English · New Zealand",base:"en",match:"en-nz"},
 {id:"en-ZA",label:"English · South African",base:"en",match:"en-za"},
 {id:"en-IN",label:"English · Indian",base:"en",match:"en-in"},
 {id:"fr-FR",label:"Français · French",base:"fr",match:"fr"},
 {id:"es-ES",label:"Español · Spanish",base:"es",match:"es"},
 {id:"de-DE",label:"Deutsch · German",base:"de",match:"de"},
 {id:"it-IT",label:"Italiano · Italian",base:"it",match:"it"},
 {id:"hi-IN",label:"हिन्दी · Hindi",base:"hi",match:"hi"}
];
const $=id=>document.getElementById(id);
const S={lang:"en-GB",gender:"male",voice:null,adj:1,manual:false,level:"easy",word:"",sent:"",typed:"",tries:0,stars:0,streak:0,busy:false,seq:0,deck:[],active:false,mode:"spell"};
try{S.stars=+localStorage.getItem("ss_stars")||0;const l=localStorage.getItem("ss_lang"),g=localStorage.getItem("ss_gender");if(LANGS.some(x=>x.id===l))S.lang=l;if(g==="male"||g==="female")S.gender=g}catch(e){}
const cur=()=>LANGS.find(l=>l.id===S.lang);
const T=()=>TX[cur().base];
const letter=ch=>(LNS[cur().base]||LNS.en)[ch]||ch;

/* ---------- voices ---------- */
const synth=window.speechSynthesis;let voices=[];
const names=s=>new RegExp("\\b("+s+")\\b","i");
const FEM=names("zira|hazel|susan|samantha|karen|catherine|moira|fiona|tessa|veena|serena|kate|libby|sonia|maisie|natasha|annette|hayley|jenny|aria|emma|amy|olivia|sara|mia|molly|clara|emily|leah|neerja|heera|hedda|katja|amala|anna|denise|hortense|julie|amelie|amélie|helena|laura|monica|mónica|paulina|elsa|alice|federica|isabella|lucia|paola|elena|carmen|nicole|joanna|ivy|kendra|kimberly|salli|marie|audrey|sabina|sylvie|jenny|ava|allison|kalpana|swara|lekha|aditi|raveena|google us english|google français|google español|google deutsch|google italiano");
const MAL=names("daniel|oliver|arthur|alex|fred|tom|lee|gordon|rishi|james|george|ryan|thomas|guy|william|mark|david|prabhat|mitchell|liam|connor|luke|conrad|stefan|markus|henri|paul|pablo|jorge|juan|cosimo|luca|ravi|jacques|diego|andrew|brian|christopher|eric|roger|steffan|guillaume|claude|alvaro|álvaro|jean|hemant|madhur|ryan");
function gen(v){const n=v.name;if(/google/i.test(n)&&/हिन्दी/.test(n))return"female";if(/\bfemale\b/i.test(n))return"female";if(/\bmale\b/i.test(n))return"male";if(FEM.test(n))return"female";if(MAL.test(n))return"male";return null}
function vscore(v){let s=0;if(/natural|neural|online/i.test(v.name))s+=5;if(v.localService)s+=1;return s}
function matches(v,L){const x=v.lang.toLowerCase().replace("_","-");return L.match.includes("-")?x.startsWith(L.match):x.split("-")[0]===L.match}
function pickVoice(vs,L,g){
  const c=vs.filter(v=>matches(v,L)).sort((a,b)=>vscore(b)-vscore(a));
  if(!c.length)return{v:null,adj:1,kind:"none"};
  const same=c.filter(v=>gen(v)===g);if(same.length)return{v:same[0],adj:1,kind:"exact"};
  const unk=c.filter(v=>!gen(v));if(unk.length)return{v:unk[0],adj:1,kind:"unknown"};
  return{v:c[0],adj:g==="male"?0.82:1.18,kind:"shifted"};
}
function applyVoice(){
  const L=cur(),r=pickVoice(voices,L,S.gender);
  S.manual=false;S.voice=r.v;S.adj=r.adj;
  const g=S.gender,n=r.v&&r.v.name;
  $("vnote").textContent=
    r.kind==="exact"?"Using "+n+".":
    r.kind==="unknown"?"Using "+n+". This device does not say whether it is male or female.":
    r.kind==="shifted"?"This device has no "+g+" voice for "+L.label+". Using "+n+" with the pitch shifted.":
    synth?"This device has no "+L.label+" voice, so the default voice will be used. Try another browser, or add a voice in your device's speech settings.":"This browser cannot speak aloud. The words will show on the screen only.";
}
function loadVoices(){
  if(!synth)return;
  voices=synth.getVoices().slice().sort((a,b)=>(matches(b,cur())-matches(a,cur()))||vscore(b)-vscore(a));
  applyVoice();
}
if(synth){synth.onvoiceschanged=loadVoices}
function utter(text,mul){
  const u=new SpeechSynthesisUtterance(text);
  if(S.voice){u.voice=S.voice;u.lang=S.voice.lang}else u.lang=cur().id;
  u.rate=(+$("rate").value)*(mul||1);u.pitch=Math.min(2,Math.max(.1,(+$("pitch").value)*S.adj));
  return u;
}
function say(text,o={}){
  show(o.caption??text);
  return new Promise(res=>{
    if(!synth){setTimeout(res,Math.min(2500,300+text.length*55));return}
    const u=utter(text,o.rate);
    let done=false;const fin=()=>{if(!done){done=true;clearTimeout(t);res()}};
    u.onend=fin;u.onerror=fin;
    const t=setTimeout(fin,Math.max(1500,text.length*130/u.rate+800));
    synth.speak(u);
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function stop(){S.seq++;if(synth)synth.cancel()}
function show(t){$("caption").textContent=t}
async function spellOut(word,mark){
  const id=S.seq;
  for(let i=0;i<word.length;i++){
    if(id!==S.seq)return;
    if(mark)mark(i);
    await say(letter(word[i]),{caption:word.slice(0,i+1).toUpperCase(),rate:.9});
    await wait(180);
  }
}

/* ---------- game ---------- */
const READY="Press Start and I will say a word. Spell it back.";
function render(state){
  const el=$("slots");el.innerHTML="";
  const n=S.word.length||5;
  for(let i=0;i<n;i++){
    const d=document.createElement("div");d.className="slot";
    const ch=S.typed[i];d.textContent=ch||"";
    if(!ch&&i===S.typed.length&&S.active)d.classList.add("on");
    if(state)d.classList.add(state);
    el.appendChild(d);
  }
  $("stars").textContent="★ "+S.stars;$("streak").textContent="Streak "+S.streak;
  $("attempt").textContent=S.active?"Try "+(S.tries+1)+" of 2":"";
}
function nextWord(){
  const list=WORDS[cur().base][S.level];
  if(!S.deck.length)S.deck=list.slice().sort(()=>Math.random()-.5);
  const [w,s]=S.deck.pop();S.word=w.toLowerCase();S.sent=s;S.typed="";S.tries=0;S.active=true;
}
async function start(){
  if(noGame())return;
  stop();const id=S.seq;nextWord();render();
  $("status").textContent="Listen";$("start").textContent="Next word";
  await wait(120);
  await say(T().please,{caption:"Listen…"});
  if(id!==S.seq)return;await wait(200);
  await say(S.word,{caption:"Listen…",rate:.8});
  if(id!==S.seq)return;
  $("status").textContent="Your turn";show("Type the word, then press Enter.");
}
function sayWord(){stop();if(S.word)say(S.word,{caption:"Listen…",rate:.8}).then(()=>show("Type the word, then press Enter."));}
function saySentence(){stop();if(!S.word)return;say(S.sent+" … "+S.word+".",{caption:S.sent,rate:.9})}
async function hint(){
  if(!S.word)return;stop();const id=S.seq;
  await say(T().starts,{caption:"Hint"});
  if(id!==S.seq)return;
  await say(letter(S.word[0]),{caption:S.word[0].toUpperCase()+"…",rate:.9});
  if(id!==S.seq)return;
  if(S.word.length>=6){await say(T().has(S.word.length),{caption:S.word.length+" letters"})}
}
function press(ch){
  if(!S.active||S.typed.length>=S.word.length)return;
  S.typed+=ch;render();
  if(synth){synth.cancel();synth.speak(utter(letter(ch),1.05))}
}
function del(){if(!S.active)return;S.typed=S.typed.slice(0,-1);render()}
async function check(){
  if(!S.active||S.busy)return;
  if(S.typed.length<S.word.length){stop();say(T().keep(S.word.length));return}
  stop();const id=S.seq;S.busy=true;
  if(S.typed===S.word){
    S.active=false;S.stars++;S.streak++;try{localStorage.setItem("ss_stars",S.stars)}catch(e){}
    render("ok");$("status").textContent="Correct";
    await say(T().correct+" "+T().praise[S.streak%5],{caption:T().correct+" "+S.word.toUpperCase()});
    if(id===S.seq)await spellOut(S.word);
    S.busy=false;
    if(id===S.seq){show("Press Next word to carry on.")}
    return;
  }
  S.tries++;S.streak=0;
  if(S.tries<2){
    render("no");$("status").textContent="Not quite";
    await say(T().notQuite,{caption:T().notQuiteCap});
    S.busy=false;if(id!==S.seq)return;
    S.typed="";render();await say(S.word,{caption:"Listen…",rate:.8});show("Type the word, then press Enter.");
  }else{
    S.active=false;S.typed=S.word;render("no");$("status").textContent="Answer";
    await say(T().giveUp(S.word),{caption:S.word.toUpperCase()});
    if(id===S.seq)await spellOut(S.word);
    S.busy=false;if(id===S.seq)show("Press Next word to try another.");
  }
  S.busy=false;
}
async function reveal(){
  if(!S.word)return;stop();const id=S.seq;S.busy=false;S.active=false;S.streak=0;S.typed=S.word;render("no");
  await say(T().reveal(S.word),{caption:S.word.toUpperCase()});
  if(id===S.seq)await spellOut(S.word);
}
function resetGame(){
  stop();S.busy=false;S.active=false;S.word="";S.typed="";S.deck=[];S.tries=0;
  $("start").textContent="Start";$("status").textContent=S.mode==="say"?"Say it":"Ready";
  show(S.mode==="say"?"Type a word or phrase below, then press Say it.":READY);render();
}

/* ---------- wiring ---------- */
const kb=$("kb");
"abcdefghijklmnopqrstuvwxyz".split("").forEach(c=>{
  const b=document.createElement("button");b.type="button";b.className="key";b.textContent=c;b.setAttribute("aria-label",c.toUpperCase());
  b.addEventListener("click",()=>press(c));kb.appendChild(b);
});
const langSel=$("lang");
LANGS.forEach(l=>{const o=document.createElement("option");o.value=l.id;o.textContent=l.label;langSel.appendChild(o)});
langSel.value=S.lang;
function syncGender(){document.querySelectorAll("#gender button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.g===S.gender))}
syncGender();
function persist(){try{localStorage.setItem("ss_lang",S.lang);localStorage.setItem("ss_gender",S.gender)}catch(e){}}
function noGame(){if(WORDS[cur().base])return false;setMode("say");show("The spelling game is not available in "+cur().label+" yet. Use Say it and the presets.");return true}
langSel.onchange=()=>{S.lang=langSel.value;persist();loadVoices();resetGame();if(!noGame()){stop();say(T().test)}else say(T().test,{caption:"The spelling game is not available in "+cur().label+" yet. Use Say it and the presets."})};
document.querySelectorAll("#gender button").forEach(b=>b.onclick=()=>{S.gender=b.dataset.g;syncGender();persist();applyVoice();stop();say(T().test)});
$("start").onclick=start;$("again").onclick=sayWord;$("sentence").onclick=saySentence;$("hint").onclick=hint;
$("del").onclick=del;$("go").onclick=check;$("skip").onclick=reveal;
function setMode(m){
  stop();S.mode=m;$("device").dataset.mode=m;
  document.querySelectorAll("#modes button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.mode===m));
  if(m==="say"){$("status").textContent="Say it";show("Type a word or phrase below, then press Say it.");$("sayText").focus()}
  else{$("status").textContent=S.active?"Your turn":"Ready";show(S.active?"Type the word, then press Enter.":READY)}
}
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function sayIt(){const t=$("sayText").value.trim();if(!t){show("Type something first.");return}stop();say(t,{caption:t})}
async function saySpellOut(){
  const t=$("sayText").value.toLowerCase().replace(/[^\p{L}]/gu,"").slice(0,30);
  if(!t){show("Type a word first.");return}
  stop();await spellOut(t)
}
$("sayGo").onclick=sayIt;$("saySpell").onclick=saySpellOut;
$("sayClear").onclick=()=>{stop();$("sayText").value="";$("sayText").focus();show("Type a word or phrase below, then press Say it.")};
$("sayText").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sayIt()}});
document.querySelectorAll("#levels button").forEach(b=>b.onclick=()=>{
  S.level=b.dataset.level;S.deck=[];
  document.querySelectorAll("#levels button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  start();
});
$("rate").oninput=e=>$("rateV").textContent=(+e.target.value).toFixed(2);
$("pitch").oninput=e=>$("pitchV").textContent=(+e.target.value).toFixed(2);
$("rate").onchange=$("pitch").onchange=()=>{stop();say(T().test)};
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("select,input"))return;
  if(e.ctrlKey||e.metaKey||e.altKey||S.mode==="say")return;
  if(/^[a-z]$/i.test(e.key)){e.preventDefault();press(e.key.toLowerCase())}
  else if(e.key==="Backspace"){e.preventDefault();del()}
  else if(e.key==="Enter"){e.preventDefault();if(S.active)check();else start()}
});
/* ---------- presets ---------- */
const NPRE=40;
const DEFAULT_PRESETS=["Hello","Good morning","Good afternoon","Good evening","Please","Thank you","Well done","Try again"];
let presets=Array.from({length:NPRE},(_,i)=>DEFAULT_PRESETS[i]||"");
try{const r=JSON.parse(localStorage.getItem("ss_presets")||"null");if(Array.isArray(r))presets=presets.map((d,i)=>typeof r[i]==="string"?r[i].slice(0,120):d)}catch(e){}
let editing=false;
function savePresets(){try{localStorage.setItem("ss_presets",JSON.stringify(presets))}catch(e){}}
function pnote(t){$("presetNote").textContent=t}
function renderPresets(focusIdx){
  const box=$("presets");box.innerHTML="";
  presets.forEach((t,i)=>{
    if(editing){
      const w=document.createElement("label");w.className="preedit";w.textContent="Preset "+(i+1);
      const inp=document.createElement("input");inp.type="text";inp.id="pre"+i;inp.maxLength=120;inp.value=t;inp.autocomplete="off";inp.spellcheck=false;
      inp.oninput=()=>{presets[i]=inp.value;savePresets()};
      inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const n=$("pre"+(i+1));if(n)n.focus();else inp.blur()}};
      w.appendChild(inp);box.appendChild(w);
    }else{
      const b=document.createElement("button");b.type="button";b.id="pbtn"+i;b.className="btn pre"+(t.trim()?"":" empty");
      const sp=document.createElement("span");sp.textContent=t.trim()||"Empty";b.appendChild(sp);
      b.setAttribute("aria-label",t.trim()?"Say: "+t:"Empty preset "+(i+1)+". Tap to add text.");
      b.onclick=()=>{
        if(!presets[i].trim()){editing=true;syncEdit();renderPresets(i);return}
        stop();b.classList.add("on");
        say(presets[i],{caption:presets[i]}).then(()=>b.classList.remove("on"));
      };
      box.appendChild(b);
    }
  });
  if(editing&&focusIdx!=null){const f=$("pre"+focusIdx);if(f)f.focus()}
}
function syncEdit(){
  $("editToggle").setAttribute("aria-pressed",editing);
  $("editToggle").textContent=editing?"Done":"Edit presets";
  pnote(editing?"Type what each button should say. Changes save as you type.":"Tap a preset to hear it. Presets are saved in this browser.");
}
$("editToggle").onclick=()=>{stop();editing=!editing;syncEdit();renderPresets(editing?0:null)};
$("saveSlot").onclick=()=>{
  const t=$("sayText").value.trim();
  if(!t){pnote("Type something in the box first.");return}
  const i=presets.findIndex(p=>!p.trim());
  if(i<0){pnote("All 40 presets are full. Use Edit presets to replace one.");return}
  presets[i]=t.slice(0,120);savePresets();renderPresets();pnote("Saved as preset "+(i+1)+".");
};
renderPresets();
S.word="apples";render();
if(synth){loadVoices()}else applyVoice();
noGame();
</script>

</body>
